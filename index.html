<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>AI Scam Message Detector Chatbot</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="chat-container">
    <header>
      <h1>🛡️ Scam Message Detector</h1>
      <p>Paste a suspicious SMS / WhatsApp message below</p>
    </header>

    <div id="chat-window" class="chat-window"></div>

    <form id="chat-form" class="chat-form">
      <textarea
        id="message-input"
        placeholder='e.g. "Congratulations! You have won ₹50,000. Click this link to claim now!"'
        rows="3"
        required
      ></textarea>
      <button type="submit">Analyze</button>
    </form>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
